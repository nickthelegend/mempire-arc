[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "../shared" },
  { access = "read-write", path = "../shared/deployments" },
  { access = "read-write", path = "../deployments" },
  # Circle's FiatToken v2.2 runtime code, etched at Arc's USDC address by the unit tests
  { access = "read", path = "./test/utils/bytecode" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    # Chainlink CCIP 2.0, Data Feeds interfaces and Chainlink Local (npm, see package.json)
    "@chainlink/contracts-ccip/=node_modules/@chainlink/contracts-ccip/",
    "@chainlink/contracts/=node_modules/@chainlink/contracts/",
    "@chainlink/local/=node_modules/@chainlink/local/",
    "@openzeppelin/contracts@5.3.0/=node_modules/@openzeppelin/contracts-5.3.0/",
    "@openzeppelin/contracts@4.8.3/=node_modules/@openzeppelin/contracts-4.8.3/",
    "@openzeppelin/contracts@5.0.2/=node_modules/@openzeppelin/contracts-5.0.2/",
    "@openzeppelin/contracts@4.7.3/=node_modules/@openzeppelin/contracts-4.7.3/",
]
auto_detect_remappings = false

[profile.default.fuzz]
runs = 256


[lint]
lint_on_build = false


[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
# arc-anvil forking Arc testnet (scripts/local-up.sh)
fork = "http://127.0.0.1:8710"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../shared" }, { access = "write", path = "../shared/deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

# Sourcify verification on Monad testnet (BlockVision runs the server).

[lint]
lint_on_build = false


[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
local = "http://127.0.0.1:8611"
fork = "http://127.0.0.1:8612"

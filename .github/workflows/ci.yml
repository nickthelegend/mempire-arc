# Every suite that is deterministic on a CI runner.
#
# The chain suites (onboarding, settlement, the end-to-end game) and the forge
# fork suites run against an arc-anvil fork of Arc mainnet (Circle's Arc
# Foundry); they run locally with `./scripts/test-all.sh` (FORK_TESTS=1 for
# the forge forks).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chainlink packages (CCIP, Data Feeds, Chainlink Local)
        working-directory: contracts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: forge test (unit; Circle FiatToken at Arc's USDC address, Chainlink Local)
        working-directory: contracts
        run: forge test --no-match-path 'test/fork/*'

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: typecheck
        run: npx tsc -b
      - name: simulation determinism
        run: npx tsx scripts/sim-test.ts
      - name: lint
        run: npx oxlint
      - name: production build
        run: VITE_CHAIN_ID=5042002 ALLOW_NO_DEPLOYMENT=1 npm run build

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports: ['27019:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node test-auth.mjs
      - run: node test-memstore.mjs
      - run: node test-locker.mjs
      - name: Kimi (against a fake Moonshot server — a test double)
        run: node test-ai.mjs
      - name: persistence across a restart (real MongoDB)
        run: node test-persistence.mjs
      - name: Circle Gateway API + ERC-8004 registries (Arc testnet, live)
        run: node test-interop.mjs

  cre:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre/market-meta
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm test

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2a5c" />

    <!--
      This is the app, not the marketing site, and it carries its own title and
      description rather than the landing page's — two hosts competing with
      identical metadata for the same brand term is how neither of them wins
      it. The canonical points at itself for the same reason: the game is
      genuinely different content from mempire.fun, so canonicalising it away
      would cost the page its own ranking for a claim that is not true.
    -->
    <title>Mempire — the market is the meta</title>
    <meta
      name="description"
      content="A real-time card battler on Monad where every fighter is a real asset and today's market buffs or nerfs it. Sign in with a passkey, put a dollar on a match, get paid in the block both results land."
    />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <link rel="icon" type="image/svg+xml" href="/crown.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mempire" />
    <meta property="og:title" content="Mempire — the market is the meta, on Monad" />
    <meta
      property="og:description"
      content="Every asset is a fighter, and today's market decides who is strong. Passkey sign-in, dollar stakes, settled on Monad."
    />
    <meta property="og:image" content="https://mempire.fun/card/btc/opengraph-image" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MempireFun" />
    <meta name="twitter:title" content="Mempire — the market is the meta, on Monad" />
    <meta
      name="twitter:description"
      content="Every asset is a fighter, and today's market decides who is strong. Passkey sign-in, dollar stakes, settled on Monad."
    />
    <meta name="twitter:image" content="https://mempire.fun/card/btc/opengraph-image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      A crawler that does not run JavaScript sees an empty div and nothing
      else, which is a thin page by every measure there is. This gives it real
      prose and, more usefully, a link onward to the site that does have
      content — so the crawl continues rather than dead-ending here.
    -->
    <noscript>
      <div style="max-width: 40rem; margin: 0 auto; padding: 2rem; font-family: system-ui, sans-serif; color: #f2f6ff; background: #0d2a5c">
        <h1>Mempire — any coin, your army</h1>
        <p>
          Mempire is a real-time card battler on Monad where every fighter is a
          real asset — a major, a memecoin or a tokenised stock — and today's
          price moves buff or nerf it. Sign in with a passkey, win matches to
          earn duplicates and merge them to level up, and battle another player
          for a staked pot paid out by a contract.
        </p>
        <p>
          The game needs JavaScript to run. The source, the rules and every
          deployed contract address are at
          <a href="https://github.com/nickthelegend/mempire-monad" style="color: #14f195">github.com/nickthelegend/mempire-monad</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Mempire on Arc — HyperIndex schema.
#
# Addresses are stored lowercase (config.yaml sets address_format: lowercase),
# so the app can query with `address.toLowerCase()`.
# Money is BigInt in base units: USDC in micro-dollars (6 dp, the ERC-20
# interface at 0x3600…0000), $MEMPIRE in wei (18 dp). Timestamps are unix
# seconds (Int).

# Arena stakes are USDC only. MatchCreated / MatchSettled / PayoutHeld still
# carry the token address; the enum keeps the field typed for the app.
enum Currency {
  USDC
}

# shared/roster.json: majors, DeFi tokens, and real-world assets (gold, FX) —
# every fighter is a Chainlink Data Feed on Arc. `unknown` = not in the roster.
enum CoinKind {
  crypto
  defi
  rwa
  unknown
}

enum CardSource {
  Mint
  MintMempire
  Starter
  Chest
}

enum MatchState {
  Open
  Active
  Settled
  Voided
  Cancelled
}

enum MatchOutcome {
  Seat0
  Seat1
  Tie
  Void
}

enum VoidReason {
  Disputed
  NoClaims
}

enum SeatResult {
  Pending
  Win
  Loss
  Tie
  Void
  Cancelled
}

# Who wrote an epoch's meta (MarketMeta.MetaSource): 0 = a Chainlink CRE report
# through the KeystoneForwarder (Arc testnet), 1 = postFromFeeds (SOURCE_FEEDS:
# each fighter's 24 h move computed on chain from its Chainlink Data Feed; the
# only source on Arc mainnet, where CRE does not run).
enum MetaSourceKind {
  ChainlinkCRE
  ChainlinkFeeds
}

# Where a cross-chain (CCIP) message stands on MempireCCIPGateway.
enum CrossChainStatus {
  Entered # ENTER ran: the player was seated in a match
  CashedOut # CASH_OUT ran: USDC burned with CCTP back to the source chain
  Failed # the action reverted (e.g. ENTER before its CCTP mint); stored for retry
  Recovered # a failed message was retried successfully (see `action`)
}

enum CrossChainAction {
  Enter
  CashOut
  Unknown
}

enum ChestTier {
  Silver
  Golden
  Magic
  Legendary
}

enum ChestState {
  Idle
  Unlocking
  Revealing
  Opened
}

# ───────────────────────────────────────────────────────────── players

type Player {
  id: ID! # lowercase address
  firstSeen: Int!
  lastActive: Int! @index

  # Arena record. `matches` counts matches that went live (both seats filled).
  matches: Int!
  matchesCreated: Int!
  matchesCancelled: Int!
  wins: Int! @index
  losses: Int!
  ties: Int!
  voids: Int!
  winsByTimeout: Int!
  plays: Int!

  # Net USDC result of decided matches (payout received − stake put up), 6 dp.
  # Voided and cancelled matches refund both stakes, so they never touch these.
  netUsdc: BigInt! @index
  wageredUsdc: BigInt!
  # USDC payouts the arena could not push (e.g. a blocklisted recipient) and is
  # holding for the player to pull with withdraw().
  heldUsdc: BigInt!

  # Collection.
  cardsOwned: Int!
  cardsMinted: Int!
  highestLevel: Int!
  merges: Int!
  mergeSpent: BigInt! # $MEMPIRE

  # Chests and rewards.
  chestsEarned: Int!
  chestsBought: Int!
  chestsForfeited: Int!
  chestsOpened: Int!
  rewardedWins: Int!
  rewardsMempire: BigInt!

  cards: [Card!]! @derivedFrom(field: "owner")
  seats: [MatchSeat!]! @derivedFrom(field: "player")
  chests: [Chest!]! @derivedFrom(field: "owner")
}

# ───────────────────────────────────────────────────────────── roster

type Coin {
  id: ID! # on-chain coinId as a decimal string
  coinId: Int! @index
  ticker: String!
  name: String!
  kind: CoinKind!
  pair: String! # Chainlink pair from the roster, e.g. "BTC / USD" ("" if not in the roster)
  feedId: String! # keccak256(pair)
  # The Chainlink AggregatorV3 proxy the cards contract prices this fighter
  # with. CoinRegistered does not carry it, so it is filled from the roster on
  # Arc mainnet (where the deploy registers exactly those proxies) and from
  # CoinFeedChanged everywhere; null on testnet / local until a CoinFeedChanged
  # (read MempireCards.coin(coinId).feed there).
  feed: String
  feedDecimals: Int! # roster decimals of the feed answer (0 if not in the roster)
  feedChanges: Int! # CoinFeedChanged count (feed migrations)
  archetype: Int!
  archetypeName: String!
  registered: Boolean!
  active: Boolean!

  cardsMinted: Int!
  cardsBurned: Int!
  liveSupply: Int!
  maxLevel: Int!
  merges: Int!

  # Arena stats, derived by joining each staked deck's cardIds to the cards'
  # coins: appearances when a deck is staked, results when a match settles.
  deckAppearances: Int!
  fielded: Int! # decided matches (win + loss + tie)
  wins: Int!
  losses: Int!
  ties: Int!
  winRateBps: Int! @index # wins / (wins + losses) in basis points
  timesPlayed: Int! # card drops of this fighter in the on-chain play log

  # Does the market meta matter? Results split by the modifier the coin carried
  # in the epoch the match snapshotted.
  winsBuffed: Int!
  lossesBuffed: Int!
  winsNerfed: Int!
  lossesNerfed: Int!

  # Latest MarketMeta modifier (±1500 bps).
  currentModifierBps: Int!
  modifierEpoch: BigInt!

  cards: [Card!]! @derivedFrom(field: "coin")
  modifiers: [CoinModifier!]! @derivedFrom(field: "coin")
}

# ───────────────────────────────────────────────────────────── cards

type Card {
  id: ID! # tokenId
  tokenId: BigInt!
  owner: Player!
  coin: Coin!
  level: Int! @index
  archetype: Int!
  source: CardSource!
  mintPrice: BigInt! # Chainlink feed answer at mint (0 for starter and chest cards)
  mintExpo: Int! # −feed decimals: price = mintPrice × 10^mintExpo USD
  mintedAt: Int!
  mintTxHash: String!
  chest: Chest # set when the card dropped from a chest

  burned: Boolean!
  burnedAt: Int
  mergedInto: Card # the card this one was burned into
  mergesAbsorbed: Int! # duplicates merged into this card
  transfers: Int!

  matchesFielded: Int!
  wins: Int!
  losses: Int!
  ties: Int!

  mergeHistory: [Merge!]! @derivedFrom(field: "card")
}

type Merge {
  id: ID! # txHash-logIndex
  card: Card!
  burned: Card!
  owner: Player!
  coin: Coin!
  newLevel: Int!
  paid: BigInt! # $MEMPIRE
  timestamp: Int! @index
  blockNumber: Int!
  txHash: String!
}

# ───────────────────────────────────────────────────────────── arena

type Match {
  id: ID! # matchId
  matchId: BigInt!
  state: MatchState! @index
  tier: Int!
  currency: Currency!
  currencyAddress: String!
  stake: BigInt!

  player0: Player!
  player1: Player
  session0: String!
  session1: String
  power0: Int!
  power1: Int
  deckHash0: String!
  deckHash1: String
  metaEpoch: BigInt
  marketEpoch: MarketEpoch

  plays0: Int!
  plays1: Int!
  playCount: Int!
  lastTick0: Int!
  lastTick1: Int!
  checkpointCount: Int!

  claim0: Int # 0 | 1 | 2 (tie) — what seat 0 says happened
  claim1: Int
  final0: String
  final1: String
  claimCount: Int!

  outcome: MatchOutcome
  winnerSeat: Int
  winner: Player
  byTimeout: Boolean!
  disputed: Boolean!
  voidReason: VoidReason
  pot: BigInt!
  rake: BigInt!
  winnerPayout: BigInt!
  tiePayoutEach: BigInt!
  winReward: BigInt!
  chestTier: ChestTier
  chestForfeited: Boolean!

  createdAt: Int! @index
  joinedAt: Int
  deadline: Int
  endedAt: Int
  durationSeconds: Int # endedAt − joinedAt for matches that went live
  createdTxHash: String!
  endedTxHash: String

  seats: [MatchSeat!]! @derivedFrom(field: "match")
  plays: [Play!]! @derivedFrom(field: "match")
  checkpoints: [Checkpoint!]! @derivedFrom(field: "match")
  claims: [Claim!]! @derivedFrom(field: "match")
}

# One row per (match, seat): the player's side of a match. This is the
# player-history entity — query MatchSeat by player, newest first.
type MatchSeat @index(fields: ["player", ["createdAt", "DESC"]]) {
  id: ID! # matchId-seat
  match: Match!
  player: Player!
  opponent: Player
  seat: Int!
  currency: Currency!
  stake: BigInt!
  power: Int!
  cardIds: [String!]!
  coinIds: [String!]! # coin of each deck slot; Played.cardIndex indexes this
  plays: Int!
  result: SeatResult!
  payout: BigInt! # what the arena paid this seat at the end
  net: BigInt! # payout − stake for decided matches, 0 for void/cancel
  createdAt: Int!
  endedAt: Int
}

# Every card drop, written on chain by the seat's session key while the match
# runs. Powers the "live on Arc" feed.
type Play {
  id: ID! # txHash-logIndex
  match: Match!
  seat: Int!
  player: Player
  tick: Int!
  cardIndex: Int!
  card: Card
  coin: Coin
  x: Int!
  y: Int!
  seq: Int! # 1-based play number for this seat
  blockNumber: Int! @index
  logIndex: Int!
  timestamp: Int! @index
  txHash: String!
}

type Checkpoint {
  id: ID! # txHash-logIndex
  match: Match!
  seat: Int!
  tick: Int!
  stateHash: BigInt!
  blockNumber: Int!
  timestamp: Int!
  txHash: String!
}

type Claim {
  id: ID! # matchId-seat
  match: Match!
  seat: Int!
  player: Player
  winner: Int!
  finalHash: String!
  timestamp: Int!
  txHash: String!
}

type HeldPayout {
  id: ID! # txHash-logIndex
  player: String! @index
  currency: Currency!
  amount: BigInt!
  timestamp: Int!
  txHash: String!
}

# Internal join: which match a settlement transaction settled, so the chest and
# reward events the arena fires later in the same transaction can find it.
type SettlementTx {
  id: ID! # txHash
  match: Match!
}

# ───────────────────────────────────────────────────────────── chests

type Chest {
  id: ID! # chestId
  owner: Player!
  tier: ChestTier!
  bought: Boolean!
  state: ChestState! @index
  match: Match # the win that paid it (null when bought)
  grantedAt: Int!
  readyAt: Int
  unlockStartedAt: Int
  skipped: Boolean!
  skipPaid: BigInt!
  revealBlock: BigInt
  recommits: Int!
  openedAt: Int
  seed: String
  cardIds: [String!]!
  cards: [Card!]! @derivedFrom(field: "chest")
}

# ───────────────────────────────────────────────────────────── market meta

type MarketEpoch {
  id: ID! # epoch
  epoch: BigInt!
  postedAt: Int!
  blockNumber: Int!
  txHash: String!
  coinCount: Int!
  maxBps: Int!
  minBps: Int!
  topCoin: Coin
  bottomCoin: Coin
  matches: Int! # matches that snapshotted this epoch at join
  # From MetaSource, emitted right after MetaPosted in the same transaction.
  # Unset only if a MetaPosted is ever seen without one.
  source: MetaSourceKind
  sourceCode: Int # raw uint8: 0 = Chainlink CRE, 1 = Chainlink Data Feeds
  poster: String # CRE: the forwarder; feeds: whoever called postFromFeeds
  modifiers: [CoinModifier!]! @derivedFrom(field: "epoch")
}

type CoinModifier {
  id: ID! # epoch-coinId
  epoch: MarketEpoch!
  coin: Coin!
  bps: Int!
  postedAt: Int!
}

# ───────────────────────────────────────────────────────────── aggregates

type DailyStats {
  id: ID! # YYYY-MM-DD (UTC)
  dayStart: Int! @index
  matchesCreated: Int!
  matchesStarted: Int!
  matchesSettled: Int!
  matchesVoided: Int!
  matchesCancelled: Int!
  ties: Int!
  volumeUsdc: BigInt! # settled pots, USDC 6 dp
  rakeUsdc: BigInt!
  plays: Int!
  checkpoints: Int!
  cardsMinted: Int!
  merges: Int!
  chestsGranted: Int!
  chestsOpened: Int!
  rewardsMempire: BigInt!
  uniquePlayers: Int!
  newPlayers: Int!
}

# Marker row: (day, player) seen. Drives DailyStats.uniquePlayers.
type PlayerDay {
  id: ID! # YYYY-MM-DD-address
}

# Protocol-wide totals: a single row with id "global".
type Totals {
  id: ID! # "global"
  players: Int!
  coins: Int! # registered fighters
  matches: Int!
  matchesSettled: Int!
  matchesVoided: Int!
  plays: Int!
  cardsMinted: Int!
  cardsBurned: Int!
  merges: Int!
  chestsOpened: Int!
  volumeUsdc: BigInt! # settled pots, USDC 6 dp
  rakeUsdc: BigInt!
  currentEpoch: BigInt!
}

# ───────────────────────────────────────────────────────────── admin

# Arena limits (MempireArena.LimitsChanged): the highest open stake tier and the
# pause switch. A single row, id "arena". The constructor sets the first limits
# without an event, so this row appears with the first setLimits() call; until
# then read maxTier() / paused() from the contract.
type ArenaLimits {
  id: ID! # "arena"
  maxTier: Int!
  paused: Boolean!
  changes: Int!
  updatedAt: Int!
  txHash: String!
}

# Contract (re)wiring, one row per event: MempireCards.CoinFeedChanged (a
# fighter moved to another Chainlink feed proxy), MarketMeta.CardsChanged,
# MempireArena.EntryGatewayChanged (the CCIP gateway allowed to seat players)
# and MempireCCIPGateway.RemoteEntrySet (a source chain allowed or removed).
type AdminChange {
  id: ID! # txHash-logIndex
  contract: String! # "MempireCards" | "MarketMeta" | "MempireArena" | "MempireCCIPGateway"
  change: String! @index # the event name
  address: String! # the new feed / cards contract / entry gateway / remote sender
  coinId: Int # CoinFeedChanged only
  selector: BigInt # RemoteEntrySet only: the CCIP chain selector
  cctpDomain: Int # RemoteEntrySet only
  timestamp: Int! @index
  blockNumber: Int!
  txHash: String!
}

# ───────────────────────────────────────────────────────────── cross-chain (CCIP)

# The source chains MempireCCIPGateway accepts (RemoteEntrySet): one
# MempireRemoteEntry per CCIP chain selector. sender = zero address disallows it.
type CCIPSource {
  id: ID! # CCIP chain selector, decimal
  selector: BigInt!
  sender: String! # MempireRemoteEntry on that chain
  cctpDomain: Int! # CCTP domain of that chain (Ethereum 0, Base 6)
  enabled: Boolean!
  changes: Int!
  updatedAt: Int!
  txHash: String!
}

# One CCIP message from MempireRemoteEntry (Base / Ethereum) handled by
# MempireCCIPGateway on Arc. "CCTP moves the dollars, CCIP carries the
# instruction": ENTER seats the player in a match with their own Arc USDC and
# cards; CASH_OUT burns their Arc USDC with CCTP back to the source chain.
# Query by player, newest first. A message that failed and was retried goes
# Failed → Recovered (the Entered / CashedOut of the retry fills match/amount).
type CrossChainMessage @index(fields: ["player", ["createdAt", "DESC"]]) {
  id: ID! # CCIP messageId (bytes32 hex, lowercase)
  status: CrossChainStatus! @index
  action: CrossChainAction!
  player: String # lowercase address (the sender on the source chain); null only if a failed message's data is undecodable
  # ENTER
  matchId: BigInt # the match opened / joined (for a failed ENTER: the match it tried to join, null for a create)
  match: Match
  created: Boolean # true = opened a new match, false = joined one
  # CASH_OUT
  amount: BigInt # USDC, 6 dp
  cctpDomain: Int # CCTP domain the USDC was burned to (Ethereum 0, Base 6)
  # From MessageFailed (Entered / CashedOut do not carry the source chain).
  sourceChainSelector: BigInt
  sender: String # MempireRemoteEntry on the source chain
  failData: String # the message data, hex — retryFailedMessage needs it back exactly
  failReason: String # revert data, hex
  createdAt: Int!
  updatedAt: Int!
  completedAt: Int # when Entered / CashedOut ran
  failedAt: Int
  recoveredAt: Int
  txHash: String! # latest transaction touching the message
  failedTxHash: String
}

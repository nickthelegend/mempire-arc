# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Arc TESTNET (chain 5042002, Envio network `arc-testnet`) — the default config
# for `pnpm codegen` / `pnpm dev` / `pnpm start`. Data comes from Envio's native
# HyperSync (https://5042002.hypersync.xyz).
#
# Siblings: config.mainnet.yaml (Arc mainnet, 5042) and config.local.yaml (the
# arc-anvil fork, 31337). All three share everything above `chains:`;
# test/config.test.ts fails if they drift. Addresses and start_block are
# written by `pnpm sync` from shared/deployments/5042002.json after the deploy.
name: mempire-indexer
description: Mempire on Arc — fighters, merges, chests, escrowed USDC 1v1 matches, the on-chain play log and the market meta (Chainlink CRE or signed-oracle momentum).
# Store every address lowercase so the app can query with address.toLowerCase().
address_format: lowercase
# Every handler stamps rows with the transaction hash (the live play feed links
# each card drop to its Arc tx). Block number and timestamp come by default.
field_selection:
  transaction_fields: [hash]
contracts:
  - name: MempireCards
    abi_file_path: ./abis/MempireCards.json
    events:
      - event: CoinRegistered
      - event: CoinActive
      - event: CardMinted
      - event: CardMerged
      - event: Transfer
      - event: ChestGranted
      - event: ChestForfeited
      - event: ChestUnlocking
      - event: ChestSkipped
      - event: ChestOpening
      - event: ChestOpened
      - event: OracleChanged
  - name: MempireArena
    abi_file_path: ./abis/MempireArena.json
    events:
      - event: MatchCreated
      - event: MatchJoined
      - event: MatchCancelled
      - event: Played
      - event: Checkpoint
      - event: Claimed
      - event: MatchSettled
      - event: MatchVoided
      - event: WinRewarded
      - event: PayoutHeld
      - event: LimitsChanged
  - name: MarketMeta
    abi_file_path: ./abis/MarketMeta.json
    events:
      - event: MetaPosted
      - event: MetaSource
      - event: OracleChanged
chains:
  - id: 5042002 # Arc testnet — native HyperSync (https://5042002.hypersync.xyz)
    start_block: 0 # TODO: set from shared/deployments/5042002.json (startBlock)
    contracts:
      - name: MempireCards
        address: "0x00000000000000000000000000000000000c0de1" # TODO: set from shared/deployments/5042002.json (cards)
      - name: MempireArena
        address: "0x00000000000000000000000000000000000c0de2" # TODO: set from shared/deployments/5042002.json (arena)
      - name: MarketMeta
        address: "0x00000000000000000000000000000000000c0de3" # TODO: set from shared/deployments/5042002.json (marketMeta)

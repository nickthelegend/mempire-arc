# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# LOCAL ONLY — the arc-anvil fork of Arc testnet started by scripts/local-up.sh
# (chain 31337, http://127.0.0.1:8710). Same project, contracts and events as
# config.yaml; only `chains:` and rollback_on_reorg differ. HyperSync does not
# cover a local chain, so the RPC is the data source (`for: sync`: historical
# sync and realtime). test/config.test.ts fails if the project section drifts.
#
#   ./scripts/local-indexer.sh up    # syncs the addresses below from
#                                    # shared/deployments/31337.json, then indexes
name: mempire-indexer
description: Mempire on Arc — fighters, merges, chests, escrowed USDC 1v1 matches, the on-chain play log and the market meta (Chainlink CRE or signed-oracle momentum).
# Store every address lowercase so the app can query with address.toLowerCase().
address_format: lowercase
# Every handler stamps rows with the transaction hash (the live play feed links
# each card drop to its Arc tx). Block number and timestamp come by default.
field_selection:
  transaction_fields: [hash]
contracts:
  - name: MempireCards
    abi_file_path: ./abis/MempireCards.json
    events:
      - event: CoinRegistered
      - event: CoinActive
      - event: CardMinted
      - event: CardMerged
      - event: Transfer
      - event: ChestGranted
      - event: ChestForfeited
      - event: ChestUnlocking
      - event: ChestSkipped
      - event: ChestOpening
      - event: ChestOpened
      - event: OracleChanged
  - name: MempireArena
    abi_file_path: ./abis/MempireArena.json
    events:
      - event: MatchCreated
      - event: MatchJoined
      - event: MatchCancelled
      - event: Played
      - event: Checkpoint
      - event: Claimed
      - event: MatchSettled
      - event: MatchVoided
      - event: WinRewarded
      - event: PayoutHeld
      - event: LimitsChanged
  - name: MarketMeta
    abi_file_path: ./abis/MarketMeta.json
    events:
      - event: MetaPosted
      - event: MetaSource
      - event: OracleChanged
# anvil never reorgs and mines a block per transaction; skip the reorg
# bookkeeping so a fresh local chain indexes in seconds.
rollback_on_reorg: false
chains:
  - id: 31337 # arc-anvil fork of Arc testnet (scripts/local-up.sh)
    start_block: 0 # TODO: set from shared/deployments/31337.json (startBlock)
    rpc:
      - url: http://127.0.0.1:8710
        for: sync
        polling_interval: 500
    contracts:
      - name: MempireCards
        address: "0x00000000000000000000000000000000000c0de1" # TODO: set from shared/deployments/31337.json (cards)
      - name: MempireArena
        address: "0x00000000000000000000000000000000000c0de2" # TODO: set from shared/deployments/31337.json (arena)
      - name: MarketMeta
        address: "0x00000000000000000000000000000000000c0de3" # TODO: set from shared/deployments/31337.json (marketMeta)

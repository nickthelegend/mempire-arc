# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Arc MAINNET (chain 5042, Envio network `arc`). Same project as config.yaml;
# only `chains:` differs. Data comes from Envio's native HyperSync
# (https://5042.hypersync.xyz).
#
#   pnpm sync:mainnet        # addresses + start_block from shared/deployments/5042.json
#   pnpm codegen:mainnet     # then: pnpm start:mainnet (or ENVIO_CONFIG=config.mainnet.yaml)
#
# On mainnet the market meta is written only by MarketMeta.postFromFeeds
# (24 h momentum read from Chainlink Data Feeds on chain; Chainlink CRE does
# not serve Arc mainnet), so every MarketEpoch.source is ChainlinkFeeds there.
name: mempire-indexer
description: Mempire on Arc — fighters priced by Chainlink Data Feeds, merges, chests, escrowed USDC 1v1 matches, the on-chain play log, the market meta (Chainlink CRE or Data Feeds momentum) and cross-chain entries over Chainlink CCIP.
# Store every address lowercase so the app can query with address.toLowerCase().
address_format: lowercase
# Every handler stamps rows with the transaction hash (the live play feed links
# each card drop to its Arc tx). Block number and timestamp come by default.
field_selection:
  transaction_fields: [hash]
contracts:
  - name: MempireCards
    abi_file_path: ./abis/MempireCards.json
    events:
      - event: CoinRegistered
      - event: CoinActive
      - event: CardMinted
      - event: CardMerged
      - event: Transfer
      - event: ChestGranted
      - event: ChestForfeited
      - event: ChestUnlocking
      - event: ChestSkipped
      - event: ChestOpening
      - event: ChestOpened
      - event: CoinFeedChanged
  - name: MempireArena
    abi_file_path: ./abis/MempireArena.json
    events:
      - event: MatchCreated
      - event: MatchJoined
      - event: MatchCancelled
      - event: Played
      - event: Checkpoint
      - event: Claimed
      - event: MatchSettled
      - event: MatchVoided
      - event: WinRewarded
      - event: PayoutHeld
      - event: LimitsChanged
      - event: EntryGatewayChanged
  - name: MarketMeta
    abi_file_path: ./abis/MarketMeta.json
    events:
      - event: MetaPosted
      - event: MetaSource
      - event: CardsChanged
  # Arc side of cross-chain play: CCIP messages from MempireRemoteEntry on
  # Base / Ethereum (USDC itself moves by CCTP). Not deployed everywhere: the
  # sync script leaves a placeholder (no events) when ccipGateway is unset.
  - name: MempireCCIPGateway
    abi_file_path: ./abis/MempireCCIPGateway.json
    events:
      - event: Entered
      - event: CashedOut
      - event: MessageFailed
      - event: MessageRecovered
      - event: RemoteEntrySet
chains:
  - id: 5042 # Arc mainnet — native HyperSync (https://5042.hypersync.xyz)
    start_block: 0 # TODO: set from shared/deployments/5042.json (startBlock)
    contracts:
      - name: MempireCards
        address: "0x00000000000000000000000000000000000c0de1" # TODO: set from shared/deployments/5042.json (cards)
      - name: MempireArena
        address: "0x00000000000000000000000000000000000c0de2" # TODO: set from shared/deployments/5042.json (arena)
      - name: MarketMeta
        address: "0x00000000000000000000000000000000000c0de3" # TODO: set from shared/deployments/5042.json (marketMeta)
      - name: MempireCCIPGateway
        address: "0x00000000000000000000000000000000000c0de4" # TODO: set from shared/deployments/5042.json (ccipGateway)

# Secret names a workflow reads -> environment variable that holds the value.
# Simulation resolves them from .env / the shell; a deployed workflow reads them
# from the Vault DON (`cre secrets create secrets.yaml --target <target>`).
# Names only — never put a value in this file.
#
# market-meta currently reads NO secrets: both of its sources (CoinGecko
# /simple/price and the Frankfurter FX API) are keyless, so
# market-meta/workflow.yaml leaves `secrets-path` empty. If a keyed source is
# added later, declare it here and point `secrets-path` back at this file.
secretsNames: {}

# Secret names the workflow reads -> environment variable that holds the value.
# Simulation resolves them from .env / the shell; a deployed workflow reads them
# from the Vault DON (`cre secrets create secrets.yaml --target <target>`).
# Names only — never put a value in this file.
#
# PYTH_API_KEY is optional in practice: set CRE_PYTH_API_KEY= (empty) and the
# workflow writes 0 bps for the 12 stocks and says so in its logs. The variable
# must still exist, because the simulator refuses to start on an unset one.
secretsNames:
  PYTH_API_KEY:
    - CRE_PYTH_API_KEY

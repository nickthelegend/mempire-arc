# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# Project-specific settings for CRE CLI targets.
# Each target defines cre-cli, account, and rpcs groups.
#
# RPC URLs support ${VAR_NAME} syntax to reference environment variables.
# Arc testnet (chain id 5042002) is in the official chain-selectors registry
# as `arc-testnet` (selector 3034092155422581607). Its forwarders
# (docs.chain.link/cre, forwarder directory):
#   simulation (MockKeystoneForwarder, `cre workflow simulate --broadcast`):
#     0x6E9EE680ef59ef64Aa8C7371279c27E496b5eDc1
#   production (KeystoneForwarder, a deployed workflow):
#     0x76c9cf548b4179F8901cda1f8623568b58215E62
# MarketMeta.forwarder must be the one matching how the report is delivered.
#
# Arc MAINNET (5042, `arc-mainnet`) is not served by CRE: there MarketMeta
# computes the meta on chain from Chainlink Data Feeds (MarketMeta.postFromFeeds).

# ==========================================================================
staging-settings:
  rpcs:
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
# ==========================================================================
production-settings:
  rpcs:
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
